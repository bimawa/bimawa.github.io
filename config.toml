# The URL the site will be built for
base_url = "https://bimawa.net"
default_language = "en"

theme = "terminimal"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

taxonomies = [
    {name = "tags", feed = true},
]

[markdown.highlighting]
# Syntax highlighting configuration
style = "inline"
theme = "monokai"

[translations]
newer_posts = "Newer posts"
older_posts = "Older posts"

[languages.ru]
generate_feeds = true
build_search_index = true
taxonomies = [{name = "tags", feed = true}]

[languages.ru.translations]
newer_posts = "Новые записи"
older_posts = "Старые записи"

[extra]
# Put all your custom variables here
accent_color = "blue-light"
background_color = "dark"
author = "Maxim Bunkov aka Bimawa"
copyright_html = "IP Bunkov Maksim Vladislavovich (Bimawa) &nbsp;<b>copyright</b>"

menu_items = [
    {name = "Blog", url = "$BASE_URL"},
    {name = "Projects", url = "$BASE_URL/projects"},
    {name = "Tags", url = "$BASE_URL/tags"},
    {name = "Archive", url = "$BASE_URL/archive"},
    {name = "About me", url = "$BASE_URL/about"},
    {name = "CV", url = "$BASE_URL/cv"},
    {name = "Contacts", url = "$BASE_URL/contacts"},
]

menu_items_ru = [
    {name = "Блог", url = "$BASE_URL/ru"},
    {name = "Проекты", url = "$BASE_URL/ru/projects"},
    {name = "Теги", url = "$BASE_URL/ru/tags"},
    {name = "Архив", url = "$BASE_URL/ru/archive"},
    {name = "Обо мне", url = "$BASE_URL/ru/about"},
    {name = "Резюме", url = "$BASE_URL/ru/cv"},
    {name = "Контакты", url = "$BASE_URL/ru/contacts"},
]

use_full_hack_font = true
favicon = "/favicon.ico"
favicon_mimetype = "image/ico"
logo_text = "Bimawa's blog"
